# nginx.conf - configuração completa

events { }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Redireciona tudo para HTTPS, exceto o desafio do Certbot
    server {
        listen 80 default_server;
        server_name meuprojetoestoque.duckdns.org;

        # Permitir validação do Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redireciona o restante para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Bloco HTTPS principal
    server {
        listen 443 ssl default_server;
        server_name meuprojetoestoque.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/meuprojetoestoque.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/meuprojetoestoque.duckdns.org/privkey.pem;

        # Otimizações de segurança SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


