<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        form {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="email"] {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 250px;
        }

        button[type="submit"] {
            padding: 8px 12px;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #007bff;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr.alerta {
            background-color: #fff3cd;
        }

        button {
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 2px;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
        }

        .btn-remove {
            background-color: #dc3545;
            color: white;
        }

        .btn-add:hover { background-color: #218838; }
        .btn-remove:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <h1>📦 Controle de Estoque</h1>

    <form method="POST" action="/registrar-email">
        <label for="email">Cadastrar e-mail para alertas:</label>
        <input type="email" name="email" required placeholder="seu@email.com">
        <button type="submit">Cadastrar</button>
    </form>

    <form method="POST" action="/remover-email">
        <label for="email">Remover e-mail dos alertas:</label>
        <input type="email" name="email" required placeholder="seu@email.com">
        <button type="submit">Remover</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantidade</th>
                <th>Limite de Alerta</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-itens"></tbody>
    </table>

    <script>
        async function carregarItens() {
            try {
                const response = await fetch('/itens');
                const itens = await response.json();

                const tabela = document.getElementById('tabela-itens');
                tabela.innerHTML = '';

                itens.forEach(item => {
                    const linha = document.createElement('tr');
                    if (item.quantidade <= item.limite_alerta) linha.classList.add('alerta');

                    linha.innerHTML = `
                        <td>${item.item}</td>
                        <td>${item.quantidade}</td>
                        <td>${item.limite_alerta}</td>
                        <td>
                            <button class="btn-remove" onclick="atualizarQuantidade('${item.item}', -1)">−</button>
                            <button class="btn-add" onclick="atualizarQuantidade('${item.item}', 1)">+</button>
                        </td>
                    `;
                    tabela.appendChild(linha);
                });
            } catch (error) {
                console.error("Erro ao carregar itens:", error);
            }
        }

        async function atualizarQuantidade(nome, delta) {
            await fetch('/atualizar_quantidade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: nome, delta })
            });
            carregarItens();
        }

        window.onload = carregarItens;
    </script>
</body>
</html>
