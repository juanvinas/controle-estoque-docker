<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #007bff;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr.alerta {
            background-color: #fff3cd;
        }

        button {
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 2px;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
        }

        .btn-remove {
            background-color: #dc3545;
            color: white;
        }

        .btn-delete {
            background-color: #6c757d;
            color: white;
        }

        .btn-add:hover { background-color: #218838; }
        .btn-remove:hover { background-color: #c82333; }
        .btn-delete:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <h1>📦 Controle de Estoque</h1>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantidade</th>
                <th>Limite de Alerta</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-itens"></tbody>
    </table>

    <script>
        async function carregarItens() {
            const response = await fetch('/itens');
            const itens = await response.json();

            const tabela = document.getElementById('tabela-itens');
            tabela.innerHTML = '';

            itens.forEach(item => {
                const linha = document.createElement('tr');
                if (item.quantidade <= item.limite_alerta) linha.classList.add('alerta');

                linha.innerHTML = `
                    <td>${item.item}</td>
                    <td>${item.quantidade}</td>
                    <td>${item.limite_alerta}</td>
                    <td>                       
                        <button class="btn-add" onclick="atualizarQuantidade('${item.item}', 1)">+</button>
                        <button class="btn-delete" onclick="deletarItem('${item.item}')">Deletar</button>
                    </td>
                `;
                tabela.appendChild(linha);
            });
        }

        async function atualizarQuantidade(nome, delta) {
            await fetch('/atualizar_quantidade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: nome, delta })
            });
            carregarItens();
        }

        async function deletarItem(nome) {
            await fetch('/deletar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: nome })
            });
            carregarItens();
        }

        carregarItens();
    </script>
</body>
</html>
