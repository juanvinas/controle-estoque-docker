<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Item ao Estoque</title>
</head>
<body>
    <h1>Adicionar Item ao Estoque</h1>

    <form id="form-estoque">
        <label for="item">Item1:</label>
        <input type="text" id="item" name="item" required><br><br>

        <label for="quantidade">Quantidade1:</label>
        <input type="number" id="quantidade" name="quantidade" required><br><br>

        <label for="status">Status:</label>
        <input type="text" id="status" name="status" value="bom" required><br><br>

        <button type="submit">Adicionar</button>
    </form>

    <p id="mensagem"></p>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("form-estoque");
            const mensagem = document.getElementById("mensagem");

            form.addEventListener("submit", async (event) => {
                event.preventDefault(); // Impede o reload da página

                const item = document.getElementById("item").value;
                const quantidade = document.getElementById("quantidade").value;
                const status = document.getElementById("status").value;

                try {
                    const response = await fetch("/adicionar", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ item, quantidade, status })
                    });

                    const result = await response.json();
                    mensagem.innerText = result.mensagem || "Item adicionado com sucesso!";
                    mensagem.style.color = "green";

                    // Limpa os campos após adicionar
                    form.reset();
                } catch (error) {
                    mensagem.innerText = "Erro ao adicionar item.";
                    mensagem.style.color = "red";
                    console.error("Erro:", error);
                }
            });
        });
    </script>
</body>
</html>
