<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            width: 350px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #0078d7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #005fa3;
        }
        #mensagem {
            margin-top: 15px;
            font-weight: bold;
        }
        table {
            margin-top: 30px;
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: center;
        }
        th {
            background: #0078d7;
            color: white;
        }
        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Controle de Estoque</h1>

    <form id="form-estoque">
        <label for="item">Item:</label>
        <input type="text" id="item" name="item" required>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" required>

        <label for="status">Status:</label>
        <input type="text" id="status" name="status" value="bom" required>

        <button type="submit">Adicionar Item</button>
    </form>

    <button id="btn-listar">📋 Ver Estoque</button>
    <p id="mensagem"></p>

    <table id="tabela-estoque" style="display:none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Item</th>
                <th>Quantidade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("form-estoque");
            const mensagem = document.getElementById("mensagem");
            const tabela = document.getElementById("tabela-estoque");
            const tbody = tabela.querySelector("tbody");
            const btnListar = document.getElementById("btn-listar");

            // ➕ Adicionar item
            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const item = document.getElementById("item").value;
                const quantidade = document.getElementById("quantidade").value;
                const status = document.getElementById("status").value;

                try {
                    const response = await fetch("/adicionar", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ item, quantidade, status })
                    });

                    const result = await response.json();
                    mensagem.innerText = result.mensagem;
                    mensagem.style.color = "green";
                    form.reset();
                } catch (error) {
                    mensagem.innerText = "Erro ao adicionar item.";
                    mensagem.style.color = "red";
                }
            });

            // 📋 Listar itens
            btnListar.addEventListener("click", async () => {
                try {
                    const response = await fetch("/listar");
                    const itens = await response.json();

                    tbody.innerHTML = ""; // limpa a tabela
                    itens.forEach(i => {
                        const row = `<tr>
                            <td>${i.id}</td>
                            <td>${i.item}</td>
                            <td>${i.quantidade}</td>
                            <td>${i.status}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });

                    tabela.style.display = "table";
                } catch (error) {
                    mensagem.innerText = "Erro ao listar itens.";
                    mensagem.style.color = "red";
                }
            });
        });
    </script>
</body>
</html>
